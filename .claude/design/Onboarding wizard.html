<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Edvantix — Onboarding</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="design-system/assets/favicon.svg">
<link rel="stylesheet" href="design-system/colors_and_type.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  :root { color-scheme: light; }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #f8fafc; font-family: var(--edv-font-sans); color: #0f172a; min-height: 100vh; }
  button { font-family: inherit; cursor: pointer; }
  a { color: inherit; text-decoration: none; }
  ::selection { background: rgba(99,102,241,0.18); }
  /* hide scrollbars on the preview pane but keep scroll */
  .ob-scroll::-webkit-scrollbar { width: 6px; }
  .ob-scroll::-webkit-scrollbar-thumb { background: rgba(148,163,184,.35); border-radius: 999px; }
  @keyframes obFadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes obScaleIn { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }
  @keyframes obProgress { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes obPulse { 0%,100% { opacity: 1 } 50% { opacity: .55 } }
  @keyframes obFloat { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-4px) } }
  .ob-fade { animation: obFadeIn .35s ease-out both; }
  .ob-scale { animation: obScaleIn .4s ease-out both; }
  @media (prefers-reduced-motion: reduce) {
    .ob-fade, .ob-scale { animation: none !important; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react" src="src/Icons.jsx"></script>
<script type="text/babel" data-presets="react" src="src/Primitives.jsx"></script>
<script type="text/babel" data-presets="react" src="src/PreviewPanels.jsx"></script>
<script type="text/babel" data-presets="react" src="src/Steps.jsx"></script>
<script type="text/babel" data-presets="react" src="src/Onboarding.jsx"></script>
<script type="text/babel" data-presets="react">
  ReactDOM.createRoot(document.getElementById('root')).render(<Onboarding/>);
</script>
</body>
</html>
