edition = "2023";

option csharp_namespace = "Edvantix.Organizational.Grpc.Services";

package permission.v1;

service PermissionGrpcService {
  rpc CheckPermission (CheckPermissionRequest) returns (CheckPermissionResponse);

  // Синхронизирует набор разрешений для функциональной области.
  // Отсутствующие в запросе разрешения удаляются; новые — создаются.
  // Предназначен для вызова при старте сервиса в качестве сидера.
  rpc SyncFeaturePermissions (SyncFeaturePermissionsRequest) returns (SyncFeaturePermissionsResponse);
}

message CheckPermissionRequest {
  string organization_id = 1;
  string permission = 2;
}

message CheckPermissionResponse {
  bool has_permission = 1;
}

// Пара «код + отображаемое название» для одного разрешения.
message PermissionEntry {
  string code = 1;
  string name = 2;
}

message SyncFeaturePermissionsRequest {
  string feature_code = 1;
  string feature_name = 2;
  repeated PermissionEntry permissions = 3;
  // Код сервиса-владельца (например, "scheduler"). Добавлен в поле 4 для обратной совместимости.
  string service_code = 4;
}

message SyncFeaturePermissionsResponse {
  int32 added = 1;
  int32 removed = 2;
}
