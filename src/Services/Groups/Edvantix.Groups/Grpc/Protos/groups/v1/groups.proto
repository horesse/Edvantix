edition = "2023";

option csharp_namespace = "Edvantix.Groups.Grpc.Services";

package groups.v1;

service GroupsGrpcService {
  rpc GetLevelStats (GetLevelStatsRequest) returns (GetLevelStatsResponse);
}

message GetLevelStatsRequest {
  string org_id = 1;
}

message GetLevelStatsResponse {
  int32 active_count = 1;
  int32 archived_count = 2;
}
