edition = "2023";

option csharp_namespace = "Edvantix.Schedule.Grpc.Services";

package schedule.v1;

/// Сервис расписаний учебных групп.
service ScheduleGrpcService {
  /// Возвращает сводки расписаний для N групп одним запросом.
  rpc GetScheduleSummariesByGroupIds (GetScheduleSummariesRequest) returns (GetScheduleSummariesResponse);

  /// Возвращает полное расписание группы.
  rpc GetScheduleByGroupId (GetScheduleByGroupIdRequest) returns (GetScheduleByGroupIdResponse);

  /// Возвращает ближайшие занятия группы.
  rpc GetUpcomingLessons (GetUpcomingLessonsRequest) returns (GetUpcomingLessonsResponse);
}

message GetScheduleSummariesRequest {
  repeated string group_ids = 1;
}

message GetScheduleSummariesResponse {
  repeated ScheduleSummary summaries = 1;
}

message ScheduleSummary {
  string group_id = 1;

  /// Человекочитаемая строка расписания, например "Пн / Ср · 18:00–19:30".
  string summary_text = 2;

  int32 lesson_duration_minutes = 3;

  /// Дата ближайшего занятия ISO yyyy-MM-dd; пусто если нет.
  string next_lesson_date = 4;

  /// Общее число материализованных занятий.
  int32 lesson_count_total = 5;

  /// Число предстоящих занятий (будущих).
  int32 lesson_count_remaining = 6;
}

// ── GetScheduleByGroupId ───────────────────────────────────────────────────────

message GetScheduleByGroupIdRequest {
  string group_id = 1;
}

message GetScheduleByGroupIdResponse {
  bool found = 1;
  ScheduleDetail schedule = 2;
}

message ScheduleDetail {
  string id = 1;

  /// "Weekly" | "Biweekly" | "Custom"
  string recurrence = 2;

  /// Чётность недели (0 или 1); присутствует только при Biweekly.
  int32 biweekly_parity = 3 [features.field_presence = EXPLICIT];

  int32 lesson_duration_minutes = 4;

  /// ISO yyyy-MM-dd
  string start_date = 5;

  /// "Date" | "Count"
  string end_mode = 6;

  /// ISO yyyy-MM-dd; присутствует только при EndMode=Date.
  string end_date = 7 [features.field_presence = EXPLICIT];

  /// Число занятий; присутствует только при EndMode=Count.
  int32 lesson_count = 8 [features.field_presence = EXPLICIT];

  bool skip_holidays = 9;

  repeated ScheduleSlotProto slots = 10;
  repeated ScheduleExceptionProto exceptions = 11;

  /// Человекочитаемая сводка расписания.
  string summary_text = 12;
}

message ScheduleSlotProto {
  int32 weekday = 1;
  int32 start_minutes = 2;
}

message ScheduleExceptionProto {
  /// ISO yyyy-MM-dd
  string date = 1;

  /// Пустая строка если причина не указана.
  string reason = 2;
}

// ── GetUpcomingLessons ─────────────────────────────────────────────────────────

message GetUpcomingLessonsRequest {
  string group_id = 1;

  /// Максимальное число занятий в ответе.
  int32 count = 2;
}

message GetUpcomingLessonsResponse {
  repeated UpcomingLessonProto lessons = 1;
}

message UpcomingLessonProto {
  /// ISO yyyy-MM-dd
  string date = 1;

  /// Начало занятия в минутах от полуночи.
  int32 start_minutes = 2;

  /// Длительность занятия в минутах.
  int32 duration_minutes = 3;
}
