<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Edvantix — Подписка</title>
<link rel="icon" href="assets/favicon.svg">
<link rel="stylesheet" href="colors_and_type.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; background: #f8fafc; font-family: var(--edv-font-sans); color: #0f172a; }
  * { box-sizing: border-box; }
  button { font-family: inherit; cursor: pointer; }
  a { color: inherit; text-decoration: none; }
  select { background-image: none; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react" src="ui/Icons.jsx"></script>
<script type="text/babel" data-presets="react" src="ui/Primitives.jsx"></script>
<script type="text/babel" data-presets="react" src="ui/Sidebar.jsx"></script>
<script type="text/babel" data-presets="react" src="ui/SubscriptionTopbar.jsx"></script>
<script type="text/babel" data-presets="react" src="ui/SubscriptionPage.jsx"></script>
<script type="text/babel" data-presets="react">
  function App() {
    const [active, setActive] = React.useState('subscription');
    return (
      <div data-screen-label="Подписка" style={{display:'flex',height:'100vh',overflow:'hidden'}}>
        <Sidebar active={active} onNavigate={setActive}/>
        <div style={{flex:1,display:'flex',flexDirection:'column',minWidth:0,overflow:'hidden'}}>
          <SubscriptionTopbar/>
          <div style={{flex:1,overflowY:'auto'}}>
            <SubscriptionPage/>
          </div>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
